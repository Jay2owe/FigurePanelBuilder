name: build-main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: maven
      - name: Install development checks
        run: python3 -m pip install -r scripts/contracts-requirements.txt
      - name: Verify and build
        run: python3 scripts/verify.py --group release
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: FigurePanelBuilder-jar
          path: |
            target/FigurePanelBuilder-*.jar
            !target/*-sources.jar
            !target/*-tests.jar
