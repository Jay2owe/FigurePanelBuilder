name: build-main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: maven
      - name: Build
        run: bash mvnw clean package
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: FigurePanelBuilder-jar
          path: target/FigurePanelBuilder-0.1.0.jar
